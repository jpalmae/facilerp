services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facilerp}
      POSTGRES_USER: ${POSTGRES_USER:-facilerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - facilerp-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facilerp} -d ${POSTGRES_DB:-facilerp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - facilerp-uploads-dev:/app/uploads
    command: flask --app app:create_app run --host=0.0.0.0 --debug
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/readyz"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      AUTO_MIGRATE_ON_START: "false"
      ENABLE_DEMO_BOOTSTRAP: "false"
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-4567}:80"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/static:ro

volumes:
  facilerp-postgres-dev:
  facilerp-uploads-dev:
