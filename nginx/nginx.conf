limit_req_zone $binary_remote_addr zone=general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

# ── HTTPS server ───────────────────────────────────────────────────
server {
  listen 443 ssl;
  server_name _;
  client_max_body_size 5m;

  # ── TLS configuration ────────────────────────────────────────────
  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ── OCSP Stapling (requires fullchain + chain from CA) ───────────
  # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
  # ssl_stapling on;
  # ssl_stapling_verify on;

  gzip on;
  gzip_types text/css application/javascript application/json text/plain application/xml;

  # ── Security headers ────────────────────────────────────────────
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ── Public health check (no rate limit) ─────────────────────────
  location /healthz {
    proxy_pass http://web:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # ── Rate-limited login ──────────────────────────────────────────
  location /auth/login {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://web:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
  }

  # ── Static files (public, cached) ──────────────────────────────
  location /static/ {
    alias /app/static/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ── Protected uploads served via Flask (authenticated) ──────────
  location /uploads/ {
    limit_req zone=general burst=10 nodelay;
    proxy_pass http://web:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # ── Everything else ─────────────────────────────────────────────
  location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://web:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 10s;
  }
}
