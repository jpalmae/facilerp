services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facilerp}
      POSTGRES_USER: ${POSTGRES_USER:-facilerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - facilerp-postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facilerp} -d ${POSTGRES_DB:-facilerp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      FLASK_ENV: production
      CREATE_DB_ON_START: "false"
      AUTO_MIGRATE_ON_START: "true"
      TRUST_PROXY_COUNT: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
      - frontend
    volumes:
      - facilerp-instance:/app/instance
      - facilerp-backups:/app/backups
      - facilerp-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    env_file: .env
    profiles: ["worker"]
    environment:
      AUTO_MIGRATE_ON_START: "false"
      ENABLE_DEMO_BOOTSTRAP: "false"
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - facilerp-instance:/app/instance

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/static:ro
      - facilerp-uploads:/app/uploads:ro
      - ${SSL_CERT_DIR:-./ssl}:/etc/nginx/ssl:ro

  # ── Scheduled backup (run daily at 02:00) ───────────────────────
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGUSER: ${POSTGRES_USER:-facilerp}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    entrypoint: >
      sh -c '
        echo "$$RETENTION_DAYS" > /dev/null &&
        apk add --no-cache dcron && echo "0 2 * * * /usr/local/bin/backup-cron" > /etc/crontabs/root &&
        echo "#!/bin/sh" > /usr/local/bin/backup-cron &&
        echo "pg_dump -h db -U $$PGUSER $$POSTGRES_DB | gzip > /backups/facilerp_$$(date +%%Y%%m%%d_%%H%%M%%S).sql.gz" >> /usr/local/bin/backup-cron &&
        echo "find /backups -name \"facilerp_*.sql.gz\" -type f -mtime +$$RETENTION_DAYS -delete" >> /usr/local/bin/backup-cron &&
        chmod +x /usr/local/bin/backup-cron &&
        echo "Backup scheduler started (retention: $$RETENTION_DAYS days)" &&
        crond -f
      '
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - facilerp-backups:/backups

networks:
  backend:
    internal: true
  frontend:

volumes:
  facilerp-postgres:
  facilerp-instance:
  facilerp-backups:
  facilerp-uploads:
